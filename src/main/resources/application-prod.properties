# Used on AWS when the environment property SPRING_PROFILES_ACTIVE=prod is set.

# Elastic Beanstalk sends web traffic to port 5000
server.port=5000

# The RDS_* values are set as environment properties in Elastic Beanstalk.
# createDatabaseIfNotExist=true makes MySQL create the database on first start if it's missing.
spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}?createDatabaseIfNotExist=true
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}

spring.h2.console.enabled=false
