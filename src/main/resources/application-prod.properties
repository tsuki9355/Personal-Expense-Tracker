# Used on AWS when the environment property SPRING_PROFILES_ACTIVE=prod is set.

# Elastic Beanstalk sends web traffic to port 5000
server.port=5000

# AWS fills in these RDS_* values automatically when a database is attached to the environment
spring.datasource.url=jdbc:mysql://${RDS_HOSTNAME}:${RDS_PORT}/${RDS_DB_NAME}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}

spring.h2.console.enabled=false
