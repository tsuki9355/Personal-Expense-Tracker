spring.application.name=expense-tracker

# Local database: H2, stored in memory (wiped when the app stops).
# MODE=MySQL makes it behave like the MySQL database we use on AWS.
spring.datasource.url=jdbc:h2:mem:expenses;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Run schema.sql on startup
spring.sql.init.mode=always

# Look inside the database at http://localhost:8080/h2-console
# (JDBC URL: jdbc:h2:mem:expenses, user: sa, no password)
spring.h2.console.enabled=true
